<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muffins Place</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase App & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <!-- Notification Banner Prompt -->
  <div id="notif-banner" style="display: none;">
    <span><i class="fa-solid fa-bell"></i> Enable notifications to receive announcement alerts!</span>
    <button onclick="requestNotificationPermission()">Enable</button>
  </div>

  <!-- Loading Overlay Screen -->
  <div id="loading-screen" class="loading-screen" style="display: none;">
    <div class="spinner"></div>
  </div>

  <!-- Authentication Screen -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-box">
      <h2><i class="fa-solid fa-cookie-bite"></i> Muffins Place</h2>
      <input type="email" id="email-input" placeholder="Email address" required>
      <input type="password" id="password-input" placeholder="Password" required>
      <button onclick="handleAuth()" class="btn-primary">Sign In / Register</button>
    </div>
  </div>

  <!-- Main Application Screen -->
  <div id="app-screen" class="app-container" style="display: none;">
    
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <h3><i class="fa-solid fa-cookie-bite"></i> Muffins Place</h3>
        <button onclick="logout()" class="icon-btn-danger" title="Logout"><i class="fa-solid fa-power-off"></i></button>
      </div>

      <div class="nav-section">
        <span class="section-title">CHANNELS</span>
        <button class="nav-btn active" onclick="switchRoom('general')"><i class="fa-solid fa-hashtag"></i> general</button>
        <button class="nav-btn" onclick="switchRoom('3d-animation')"><i class="fa-solid fa-cube"></i> 3d-animation</button>
        <button class="nav-btn" onclick="switchRoom('voice-acting')"><i class="fa-solid fa-microphone"></i> voice-acting</button>
        <button class="nav-btn" onclick="switchRoom('scripts')"><i class="fa-solid fa-scroll"></i> scripts</button>
      </div>

      <div class="nav-section">
        <span class="section-title">ADMIN MANAGEMENT</span>
        <button id="role-btn" class="nav-btn" onclick="openRoleModal()" style="display: none;"><i class="fa-solid fa-user-gear"></i> Manage Roles</button>
      </div>
    </nav>

    <!-- Main Chat View -->
    <main class="chat-area">
      <div class="chat-header">
        <h3 id="current-room-title"><i class="fa-solid fa-hashtag"></i> general</h3>
      </div>

      <div id="message-container" class="message-container"></div>

      <!-- Input Area -->
      <div class="input-area">
        <label for="file-upload" class="attach-btn"><i class="fa-solid fa-paperclip"></i></label>
        <input type="file" id="file-upload" style="display: none;" onchange="handleFileUpload(event)">
        
        <input type="text" id="message-input" placeholder="Drop a message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </main>
  </div>

  <!-- Role Management Modal -->
  <div id="role-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Assign User Roles</h3>
        <button onclick="closeRoleModal()" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <label>Select User:</label>
        <select id="user-select-dropdown" class="modal-select"></select>

        <label style="margin-top: 10px; display: block;">Roles (comma-separated):</label>
        <input type="text" id="custom-role-input" placeholder="e.g. OWNER, 3D ANIMATOR" class="modal-input">

        <button onclick="saveTargetUserRoles()" class="btn-primary" style="margin-top: 15px;">Save Roles</button>
      </div>
    </div>
  </div>

  <!-- Profile View Modal -->
  <div id="profile-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="profile-name">User Profile</h3>
        <button onclick="closeProfileModal()" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="profile-roles-container" class="roles-badge-container"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
