<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Hub Chat</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    body { background: #1e1e2e; color: #fff; display: flex; height: 100vh; justify-content: center; align-items: center; }
    
    #login-screen { background: #2b2b3b; padding: 30px; border-radius: 8px; width: 320px; text-align: center; }
    #login-screen h2 { margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 5px; border: none; }
    button { background: #7289da; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #5b6eae; }

    #app-screen { display: none; width: 100%; height: 100vh; }
    .sidebar { width: 250px; background: #2b2b3b; padding: 20px; display: flex; flex-direction: column; }
    .sidebar h3 { margin-bottom: 15px; color: #7289da; }
    .room-btn { background: transparent; text-align: left; color: #ccc; margin-bottom: 5px; }
    .room-btn.active { background: #40445b; color: white; }
    
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #1e1e2e; }
    .chat-header { padding: 15px; background: #252535; border-bottom: 1px solid #333; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { background: #2b2b3b; padding: 10px; border-radius: 6px; max-width: 70%; }
    .message .author { font-size: 0.8rem; color: #7289da; font-weight: bold; margin-bottom: 4px; }
    
    .input-area { padding: 15px; background: #252535; display: flex; gap: 10px; }
    .input-area input { margin: 0; flex: 1; background: #1e1e2e; color: white; border: 1px solid #444; }
    .input-area button { width: auto; padding: 0 20px; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h2>Join Team Hub</h2>
    <input type="text" id="username-input" placeholder="Your Name" onkeydown="if(event.key === 'Enter') joinTeam()" required>
    <select id="role-select">
      <option value="3D Animator">3D Animator</option>
      <option value="Voice Actor">Voice Actor</option>
      <option value="Scriptwriter">Scriptwriter</option>
      <option value="Editor">Editor</option>
    </select>
    <button onclick="joinTeam()">Enter Workspace</button>
  </div>

  <!-- CHAT APP SCREEN -->
  <div id="app-screen">
    <div class="sidebar">
      <h3>Chat Rooms</h3>
      <button class="room-btn active" onclick="switchRoom('general')"># general</button>
      <button class="room-btn" onclick="switchRoom('animation')"># 3d-animation</button>
      <button class="room-btn" onclick="switchRoom('voice-acting')"># voice-acting</button>
      <button class="room-btn" onclick="switchRoom('scripts')"># scripts</button>
    </div>
    
    <div class="chat-area">
      <div class="chat-header">
        <h4 id="current-room-title"># general</h4>
      </div>
      <div class="messages" id="message-container"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
